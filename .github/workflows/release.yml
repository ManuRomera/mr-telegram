name: Build Foundry Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release-init]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir -p dist/mr-telegram
          rsync -a --exclude '.git' --exclude 'dist' --exclude '.github' ./ dist/mr-telegram/
          cd dist && zip -r mr-telegram.zip mr-telegram

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          target_commitish: ${{ github.sha }}
          name: M.R.- Telegram ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          generate_release_notes: true
          files: |
            module.json
            dist/mr-telegram.zip
