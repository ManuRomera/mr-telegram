name: Build Foundry Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          mkdir -p dist/mr-telegram
          rsync -a --exclude '.git' --exclude 'dist' --exclude '.github' ./ dist/mr-telegram/
          cd dist && zip -r mr-telegram.zip mr-telegram
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/mr-telegram.zip
